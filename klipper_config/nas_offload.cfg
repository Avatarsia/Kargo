# KARGO - Klipper Archive & Remote G-code Operations
# Macros Configuration
#
# Include this file in your printer.cfg:
#   [include nas_offload.cfg]

[gcode_macro SDCARD_PRINT_FILE]
# Override built-in print start to trigger FETCH
rename_existing: _SDCARD_PRINT_FILE_ORIGINAL
gcode:
    {% set filepath = params.FILENAME|string %}
    
    RESPOND MSG="KARGO: Checking {filepath}..."
    
    # Call FETCH via Moonraker remote method
    {action_call_remote_method("nas_offload_fetch", filename=filepath)}
    
    # Small delay to allow fetch to complete
    G4 P500
    
    # Start the print with original command
    _SDCARD_PRINT_FILE_ORIGINAL FILENAME={filepath}


[gcode_macro NAS_STATUS]
description: Show KARGO system status
gcode:
    RESPOND MSG="Querying KARGO status..."
    RESPOND MSG="Use Mainsail console or API: http://localhost:7125/server/nas_offload/status"


[gcode_macro NAS_FETCH]
description: Manually fetch a file from NAS
gcode:
    {% set file = params.FILE|default("")|string %}
    
    {% if file == "" %}
        RESPOND TYPE=error MSG="Usage: NAS_FETCH FILE=<filename>"
    {% else %}
        RESPOND MSG="Fetching {file} from NAS..."
        {action_call_remote_method("nas_offload_fetch", filename=file)}
        RESPOND MSG="Fetch complete. Check console for status."
    {% endif %}


[gcode_macro NAS_OFFLOAD]
description: Manually offload a file to NAS
gcode:
    {% set file = params.FILE|default("")|string %}
    
    {% if file == "" %}
        RESPOND TYPE=error MSG="Usage: NAS_OFFLOAD FILE=<filename>"
    {% else %}
        RESPOND MSG="Offloading {file} to NAS..."
        # Note: This calls the API endpoint, not a remote method
        RESPOND MSG="Use API: POST http://localhost:7125/server/nas_offload/offload"
        RESPOND MSG="  with body: {\"filename\": \"{file}\", \"end_state\": \"manual\"}"
    {% endif %}
